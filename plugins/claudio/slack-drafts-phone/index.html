<title>Slack Drafts</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;0,900;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* One phone-width column; each draft reads like a Slack message (avatar, name and time, the message under the name), its actions full width below. */
  :root {
    --bg: #f4f6f5;
    --surface: #ffffff;
    --fg: #1d2321;
    --muted: #5d6763;
    --rule: #dce1de;
    --accent: #0f6b5c;
    --accent-ink: #ffffff;
    --accent-soft: #e1efea;
    --mention: #6a3ab8;
    --mention-bg: #efe8fb;
    --code-bg: #eef1ef;
    --code-fg: #b4234a;
    --ok: #1d7a43;
    --ok-ink: #ffffff;
    --err: #b3261e;
    --body: "Lato", "Helvetica Neue", Arial, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141816; --surface: #1c211f; --fg: #e6ebe8; --muted: #9aa5a0; --rule: #2e3532;
      --accent: #4fc3a8; --accent-ink: #0b1411; --accent-soft: #1f3430;
      --mention: #c6abff; --mention-bg: #2f2747; --code-bg: #262c29; --code-fg: #f08ba5;
      --ok: #6fd39a; --ok-ink: #0b1411; --err: #ff8a80; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141816; --surface: #1c211f; --fg: #e6ebe8; --muted: #9aa5a0; --rule: #2e3532;
    --accent: #4fc3a8; --accent-ink: #0b1411; --accent-soft: #1f3430;
    --mention: #c6abff; --mention-bg: #2f2747; --code-bg: #262c29; --code-fg: #f08ba5;
    --ok: #6fd39a; --ok-ink: #0b1411; --err: #ff8a80; color-scheme: dark;
  }
  body { background: var(--bg); color: var(--fg); font: 16px/1.5 var(--body); padding-block: 20px 40px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  main { max-width: 600px; margin: 0 auto; display: grid; gap: 20px; }
  header { display: grid; gap: 4px; }
  h1 { font: 900 1.625rem/1.15 var(--body); margin: 0; text-wrap: balance; }
  .lede { margin: 0; color: var(--muted); font-size: 0.9375rem; }
  .list { display: grid; gap: 14px; }

  .draft { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 14px;
    display: grid; grid-template-columns: 36px minmax(0, 1fr); column-gap: 10px; row-gap: 14px; }
  .draft:has(button.copied) { border-color: var(--ok); }
  /* Slack's rounded-square avatar, with the recipient's initial */
  .avatar { width: 36px; height: 36px; border-radius: 8px; background: var(--accent-soft); color: var(--accent);
    display: grid; place-items: center; font-weight: 900; font-size: 1.05rem; text-transform: uppercase; }
  .content { display: grid; gap: 8px; min-width: 0; }
  .meta { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; line-height: 1.2; }
  .who { font-weight: 900; }
  .when { font-size: 0.8125rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .where { color: var(--muted); font-size: 0.875rem; line-height: 1.4; display: grid; gap: 2px; overflow-wrap: anywhere; min-width: 0; }
  .where p { margin: 0; }
  .where a { color: var(--accent); font-weight: 700; text-decoration: none; }
  .files { margin: 0; color: var(--muted); font-size: 0.875rem; overflow-wrap: anywhere; display: flex; gap: 6px; align-items: flex-start; }
  .files svg { width: 16px; height: 16px; flex: none; margin-top: 2px; }

  .message { overflow-wrap: anywhere; min-width: 0; }
  .message p { margin: 0 0 8px; }
  .message p:last-child, .message ul:last-child, .message ol:last-child, .message pre:last-child, .message blockquote:last-child { margin-bottom: 0; }
  .message ul, .message ol { margin: 0 0 8px; padding-left: 22px; }
  .message a { color: var(--accent); }
  .message code { font: 0.86em var(--mono); background: var(--code-bg); color: var(--code-fg); padding: 1px 4px; border-radius: 3px; }
  .message pre { margin: 0 0 8px; padding: 8px 10px; background: var(--code-bg); border-radius: 6px; overflow-x: auto; }
  .message pre code { background: none; color: var(--fg); padding: 0; }
  .message blockquote { margin: 0 0 8px; padding-left: 10px; border-left: 3px solid var(--rule); color: var(--muted); }
  /* a typed @name pastes as plain text, so it is the one to re-tag in Slack */
  .mention { color: var(--mention); background: var(--mention-bg); font-weight: 700; padding: 0 3px; border-radius: 4px; }

  .actions, .status { grid-column: 1 / -1; }
  .actions { display: flex; gap: 8px; }
  button { font: 700 0.9375rem/1 var(--body); min-height: 44px; padding: 0 14px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--accent); background: transparent; color: var(--accent);
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  button svg { width: 18px; height: 18px; flex: none; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); flex: 1 1 auto; }
  button.primary.copied { background: var(--ok); border-color: var(--ok); color: var(--ok-ink); }
  button.quiet { border-color: var(--rule); color: var(--muted); padding: 0 12px; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .status { margin: -4px 0 0; font-size: 0.875rem; line-height: 1.4; font-weight: 700; }
  .status:empty { display: none; }
  .status.ok { color: var(--ok); }
  .status.err { color: var(--err); }

  .empty { background: var(--surface); border: 1px dashed var(--rule); border-radius: 12px; padding: 20px 16px; color: var(--muted); display: grid; gap: 6px; }
  .empty strong { color: var(--fg); }
  code.inline { font: 0.86em var(--mono); background: var(--code-bg); color: var(--code-fg); padding: 1px 4px; border-radius: 3px; }

  @media (prefers-reduced-motion: no-preference) {
    .draft { transition: border-color 0.2s; }
    button { transition: background-color 0.15s, border-color 0.15s, color 0.15s; }
    button.copied { animation: pop 0.32s ease-out; }
    @keyframes pop { 0% { transform: scale(0.95); } 60% { transform: scale(1.03); } 100% { transform: none; } }
  }
</style>

<main>
  <header>
    <h1>Slack Drafts</h1>
    <p class="lede" id="lede">Drafts from <code class="inline">/write-slack-message</code>, ready to paste into Slack with links and code intact.</p>
  </header>
  <div class="list" id="list">
    <div class="empty" id="empty">
      <strong>Loading your drafts…</strong>
      <span>New drafts appear here a few seconds after Claude saves them on the Mac.</span>
    </div>
  </div>
</main>

<script src="slack-html.js"></script>
<script>
  const list = document.getElementById('list');
  const lede = document.getElementById('lede');
  const { toHtml, labelOf, splitDraft, MENTION } = window.SlackHtml;
  let drafts = []; // newest version of each draft name, newest first
  let pruned = false;
  let drawn = null; // the drafts the list last drew, so a snapshot that changes none leaves the cards (and their Copied state) alone
  const copiedAt = new Map(); // draft name -> when its last copy worked; outlives a redraw
  const HOLD_MS = 4000; // how long the button itself says Copied

  const svg = d => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + '</svg>';
  const ICON_COPY = svg('<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/>');
  const ICON_CHECK = svg('<path d="M4 12.5l5 5L20 6.5"/>');
  const ICON_TRASH = svg('<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/>');
  const ICON_CLIP = svg('<path d="M21 11.5l-8.6 8.6a5 5 0 0 1-7.1-7.1l8.6-8.6a3.3 3.3 0 0 1 4.7 4.7l-8.6 8.6a1.7 1.7 0 0 1-2.4-2.4l7.9-7.9"/>');

  const showEmpty = (title, body) => {
    list.innerHTML = '';
    const box = document.createElement('div');
    box.className = 'empty';
    const t = document.createElement('strong'); t.textContent = title;
    const b = document.createElement('span'); b.textContent = body;
    box.append(t, b);
    list.append(box);
  };

  // Display only: each @name outside code and links gets the mention color; the copy still takes the draft as written.
  const markMentions = root => {
    const walk = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode: n => (n.parentElement && n.parentElement.closest('code, pre, a') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT),
    });
    const texts = [];
    while (walk.nextNode()) texts.push(walk.currentNode);
    for (const node of texts) {
      const parts = node.data.split(MENTION);
      if (parts.length < 2) continue;
      node.replaceWith(...parts.map((p, i) => {
        if (i % 2 === 0) return document.createTextNode(p);
        const s = document.createElement('span'); s.className = 'mention'; s.textContent = p;
        return s;
      }));
    }
    return root;
  };

  // Links in a draft are rendered live, so only web links survive.
  const safeHtml = md => {
    const tpl = document.createElement('template');
    tpl.innerHTML = toHtml(md);
    tpl.content.querySelectorAll('a').forEach(a => {
      if (!/^https?:\/\//i.test(a.getAttribute('href') || '')) a.replaceWith(document.createTextNode(a.textContent));
      else { a.target = '_blank'; a.rel = 'noopener'; }
    });
    return tpl.content;
  };

  const say = (el, ok, text) => { el.textContent = text; el.className = 'status ' + (ok ? 'ok' : 'err'); };
  const why = e => (e && (e.code || e.name || e.message)) || 'unknown error';
  const clock = t => new Date(t).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });

  // The button says Copied for HOLD_MS, then the line under it keeps saying when.
  const paintCopy = (btn, status, name) => {
    const at = copiedAt.get(name);
    const fresh = at !== undefined && Date.now() - at < HOLD_MS;
    btn.classList.toggle('copied', fresh);
    btn.innerHTML = fresh ? ICON_CHECK + '<span>Copied</span>' : ICON_COPY + '<span>Copy for Slack</span>';
    if (at !== undefined) say(status, true, 'Copied at ' + clock(at) + '. Paste it into Slack, then tap Sent.');
    if (fresh) setTimeout(() => { if (btn.isConnected) paintCopy(btn, status, name); }, HOLD_MS - (Date.now() - at));
  };

  // The copy takes the message alone, never the where-to-post lines above it.
  const copyFormatted = async (md, name, btn, status) => {
    try {
      if (!window.ClipboardItem || !navigator.clipboard?.write) throw new Error('formatted copy is not available here');
      await navigator.clipboard.write([new ClipboardItem({
        'text/html': new Blob([toHtml(md)], { type: 'text/html' }),
        'text/plain': new Blob([md], { type: 'text/plain' }),
      })]);
      copiedAt.set(name, Date.now());
      paintCopy(btn, status, name);
    } catch (e) {
      say(status, false, 'Could not copy (' + why(e) + '). Tap Copy for Slack again.');
    }
  };

  const render = (db) => {
    if (drafts.length === 0) {
      lede.textContent = 'Drafts from Claude, ready to paste into Slack with links and code intact.';
      showEmpty('No drafts yet', 'Ask Claude for a Slack message on the Mac and it shows up here.');
      return;
    }
    lede.textContent = drafts.length + (drafts.length === 1 ? ' draft' : ' drafts') + ', newest first. Copy one, paste it into Slack, then tap Sent.';
    list.innerHTML = '';
    for (const d of drafts) {
      const { who, when } = labelOf(d.name);
      const card = document.createElement('article');
      card.className = 'draft';

      const avatar = document.createElement('div'); avatar.className = 'avatar'; avatar.setAttribute('aria-hidden', 'true');
      avatar.textContent = (who.match(/[A-Za-z0-9]/) || ['#'])[0];

      const content = document.createElement('div'); content.className = 'content';
      const meta = document.createElement('div'); meta.className = 'meta';
      const w = document.createElement('span'); w.className = 'who'; w.textContent = who;
      const t = document.createElement('span'); t.className = 'when'; t.textContent = when;
      meta.append(w, t);

      const { body, where, attachments = [] } = splitDraft(d.md);
      const place = document.createElement('div'); place.className = 'where';
      place.hidden = where === '';
      if (where) place.append(safeHtml(where));
      // The files live on the Mac, so the page names them for the paste there.
      const files = document.createElement('p'); files.className = 'files';
      files.hidden = attachments.length === 0;
      files.innerHTML = ICON_CLIP;
      files.append(document.createTextNode('Attach on the Mac: ' + attachments.map(p => p.split('/').pop()).join(', ')));

      const msg = document.createElement('div'); msg.className = 'message';
      msg.append(markMentions(safeHtml(body)));
      content.append(meta, place, files, msg);

      const status = document.createElement('p'); status.className = 'status'; status.setAttribute('role', 'status');

      const actions = document.createElement('div'); actions.className = 'actions';
      const copy = document.createElement('button'); copy.type = 'button'; copy.className = 'primary';
      paintCopy(copy, status, d.name);
      copy.addEventListener('click', () => copyFormatted(body, d.name, copy, status));
      // A tombstone, not a delete, so the Mac sees it: Sent moves its file to
      // sent/ (so Claude knows it went out), the trash icon moves it to the Trash.
      const done = async sent => {
        const now = Date.now();
        const id = d.name.replace(/\.md$/, '').replace(/[^A-Za-z0-9_.~:@+-]/g, '_') + '-phone-' + now;
        try { await db.collection('drafts').doc(id).set({ name: d.name, deleted: true, sent, from: 'phone', savedAt: now }); }
        catch (e) { say(status, false, 'Could not ' + (sent ? 'mark it sent' : 'discard it') + ' (' + why(e) + ').'); }
      };
      const sentBtn = document.createElement('button'); sentBtn.type = 'button'; sentBtn.textContent = 'Sent';
      sentBtn.addEventListener('click', () => done(true));
      const del = document.createElement('button'); del.type = 'button'; del.className = 'quiet';
      del.setAttribute('aria-label', 'Discard draft'); del.title = 'Discard';
      del.innerHTML = ICON_TRASH;
      del.addEventListener('click', () => done(false));
      actions.append(copy, sentBtn, del);

      card.append(avatar, content, actions, status);
      list.append(card);
    }
  };

  // Both sides only add rows (a new row per save, a tombstone per delete), so the
  // newest row per draft name wins and the rest are leftovers this page tidies once.
  // A phone delete stays until the Mac answers it with its own tombstone, which says
  // the file is in the Trash. ponytail: a draft no Mac holds keeps its rows, hidden.
  const fold = docs => {
    const byName = new Map();
    for (const doc of docs) {
      const row = doc.data();
      if (!row || typeof row.name !== 'string') continue;
      const g = byName.get(row.name) || { name: row.name, ids: [], newest: null, macDeleted: false };
      g.ids.push(doc.id);
      if (row.deleted && row.from !== 'phone') g.macDeleted = true;
      if (!g.newest || (row.savedAt || 0) > (g.newest.savedAt || 0)) g.newest = { ...row, id: doc.id };
      byName.set(row.name, g);
    }
    const groups = [...byName.values()];
    const live = groups.filter(g => !g.newest.deleted)
      .map(g => ({ name: g.name, md: String(g.newest.md || ''), savedAt: g.newest.savedAt || 0 }))
      .sort((a, b) => b.savedAt - a.savedAt);
    const stale = groups.flatMap(g => g.newest.deleted ? (g.macDeleted ? g.ids : []) : g.ids.filter(id => id !== g.newest.id));
    return { live, stale };
  };

  const prune = async (db, ids) => {
    for (const id of ids) {
      try { await db.collection('drafts').doc(id).delete(); } catch (e) { return; }
    }
  };

  (async () => {
    const db = await window.claude?.use?.('db');
    if (!db) {
      showEmpty('Drafts are not available here', 'Open this page signed in to Claude to see your drafts.');
      return;
    }
    db.collection('drafts').onSnapshot(snap => {
      const { live, stale } = fold(snap.docs);
      const key = live.map(d => d.name + '@' + d.savedAt + '#' + d.md.length).join('|');
      if (key !== drawn) {
        drawn = key;
        drafts = live;
        render(db);
      }
      if (!pruned && !snap.metadata.fromCache && stale.length) {
        pruned = true;
        setTimeout(() => prune(db, stale), 0);
      }
    }, e => { drawn = null; showEmpty('Could not load drafts', 'The store answered: ' + why(e) + '. Reload the page to try again.'); });
  })();
</script>
