<title>Slack Drafts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* One phone-width column of draft cards, newest first; each card is the message as Slack shows it plus its copy buttons. */
  :root {
    --bg: #f6f7f5;
    --surface: #ffffff;
    --fg: #1d2321;
    --muted: #5d6763;
    --rule: #d9dedb;
    --accent: #0f6b5c;
    --accent-ink: #ffffff;
    --code-bg: #eef1ef;
    --code-fg: #b4234a;
    --ok: #1d7a43;
    --err: #b3261e;
    --body: "Lato", "Helvetica Neue", Arial, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141816; --surface: #1c211f; --fg: #e6ebe8; --muted: #9aa5a0; --rule: #2e3532;
      --accent: #4fc3a8; --accent-ink: #0b1411; --code-bg: #262c29; --code-fg: #f08ba5;
      --ok: #6fd39a; --err: #ff8a80; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141816; --surface: #1c211f; --fg: #e6ebe8; --muted: #9aa5a0; --rule: #2e3532;
    --accent: #4fc3a8; --accent-ink: #0b1411; --code-bg: #262c29; --code-fg: #f08ba5;
    --ok: #6fd39a; --err: #ff8a80; color-scheme: dark;
  }
  body { background: var(--bg); color: var(--fg); font: 16px/1.5 var(--body); padding-inline: 16px; padding-block: 20px 40px; }
  main { max-width: 600px; margin: 0 auto; display: grid; gap: 20px; }
  header { display: grid; gap: 2px; }
  h1 { font-size: 1.5rem; margin: 0; text-wrap: balance; }
  .lede { margin: 0; color: var(--muted); font-size: 0.9375rem; }
  .list { display: grid; gap: 16px; }
  .draft { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 14px 16px; display: grid; gap: 12px; min-width: 0; }
  .meta { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .who { font-weight: 700; }
  .when { font: 0.78rem/1 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
  .where { color: var(--muted); font-size: 0.875rem; display: grid; gap: 2px; overflow-wrap: anywhere; min-width: 0; }
  .where p { margin: 0; }
  .where a { color: var(--accent); }
  .message { overflow-wrap: anywhere; min-width: 0; }
  .message p { margin: 0 0 8px; }
  .message p:last-child, .message ul:last-child, .message ol:last-child { margin-bottom: 0; }
  .message ul, .message ol { margin: 0 0 8px; padding-left: 22px; }
  .message a { color: var(--accent); }
  .message code { font: 0.86em var(--mono); background: var(--code-bg); color: var(--code-fg); padding: 1px 4px; border-radius: 3px; }
  .message pre { margin: 0 0 8px; padding: 8px 10px; background: var(--code-bg); border-radius: 6px; overflow-x: auto; }
  .message pre code { background: none; color: var(--fg); padding: 0; }
  .message blockquote { margin: 0 0 8px; padding-left: 10px; border-left: 3px solid var(--rule); color: var(--muted); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  button { font: 700 0.9375rem/1 var(--body); padding: 12px 14px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--accent); background: transparent; color: var(--accent); }
  button.primary { background: var(--accent); color: var(--accent-ink); flex: 1 1 160px; }
  button.quiet { border-color: var(--rule); color: var(--muted); }
  button.icon { padding: 10px 12px; display: inline-flex; align-items: center; }
  button.icon svg { width: 18px; height: 18px; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .status { min-height: 1.25em; margin: 0; font: 0.8rem/1.4 var(--mono); }
  .status.ok { color: var(--ok); }
  .status.err { color: var(--err); }
  .empty { background: var(--surface); border: 1px dashed var(--rule); border-radius: 10px; padding: 20px 16px; color: var(--muted); display: grid; gap: 6px; }
  .empty strong { color: var(--fg); }
  code.inline { font: 0.86em var(--mono); background: var(--code-bg); color: var(--code-fg); padding: 1px 4px; border-radius: 3px; }
  @media (prefers-reduced-motion: no-preference) { .draft { transition: border-color 0.2s; } }
</style>

<main>
  <header>
    <h1>Slack Drafts</h1>
    <p class="lede">Drafts from <code class="inline">/write-slack-message</code>, ready to paste into Slack with links and code intact.</p>
  </header>
  <div class="list" id="list" aria-live="polite">
    <div class="empty" id="empty">
      <strong>Loading your drafts…</strong>
      <span>New drafts appear here a few seconds after Claude saves them on the Mac.</span>
    </div>
  </div>
</main>

<script src="slack-html.js"></script>
<script>
  const list = document.getElementById('list');
  const { toHtml, toPlain, labelOf, splitDraft } = window.SlackHtml;
  let drafts = []; // newest version of each draft name, newest first
  let pruned = false;

  const showEmpty = (title, body) => {
    list.innerHTML = '';
    const box = document.createElement('div');
    box.className = 'empty';
    const t = document.createElement('strong'); t.textContent = title;
    const b = document.createElement('span'); b.textContent = body;
    box.append(t, b);
    list.append(box);
  };

  // Links in a draft are rendered live, so only web links survive.
  const safeHtml = md => {
    const tpl = document.createElement('template');
    tpl.innerHTML = toHtml(md);
    tpl.content.querySelectorAll('a').forEach(a => {
      if (!/^https?:\/\//i.test(a.getAttribute('href') || '')) a.replaceWith(document.createTextNode(a.textContent));
      else { a.target = '_blank'; a.rel = 'noopener'; }
    });
    return tpl.content;
  };

  const say = (el, ok, text) => { el.textContent = text; el.className = 'status ' + (ok ? 'ok' : 'err'); };
  const why = e => (e && (e.code || e.name || e.message)) || 'unknown error';

  // Both copies take the message alone, never the where-to-post lines above it.
  const copyFormatted = async (md, status) => {
    try {
      if (!window.ClipboardItem || !navigator.clipboard?.write) throw new Error('formatted copy is not available here');
      await navigator.clipboard.write([new ClipboardItem({
        'text/html': new Blob([toHtml(md)], { type: 'text/html' }),
        'text/plain': new Blob([md], { type: 'text/plain' }),
      })]);
      say(status, true, 'Copied. Paste it into Slack.');
    } catch (e) {
      say(status, false, 'Could not copy (' + why(e) + '). Try Copy plain.');
    }
  };

  const copyPlain = async (md, status) => {
    try {
      await navigator.clipboard.writeText(toPlain(md));
      say(status, true, 'Copied as plain text: links are bare URLs.');
    } catch (e) {
      say(status, false, 'Could not copy (' + why(e) + ').');
    }
  };

  const render = (db) => {
    if (drafts.length === 0) {
      showEmpty('No drafts yet', 'Ask Claude for a Slack message on the Mac and it shows up here.');
      return;
    }
    list.innerHTML = '';
    for (const d of drafts) {
      const { who, when } = labelOf(d.name);
      const card = document.createElement('article');
      card.className = 'draft';

      const meta = document.createElement('div'); meta.className = 'meta';
      const w = document.createElement('span'); w.className = 'who'; w.textContent = who;
      const t = document.createElement('span'); t.className = 'when'; t.textContent = when;
      meta.append(w, t);

      const { body, where } = splitDraft(d.md);
      const place = document.createElement('div'); place.className = 'where';
      place.hidden = where === '';
      if (where) place.append(safeHtml(where));

      const msg = document.createElement('div'); msg.className = 'message';
      msg.append(safeHtml(body));

      const status = document.createElement('p'); status.className = 'status'; status.setAttribute('role', 'status');

      const actions = document.createElement('div'); actions.className = 'actions';
      const copy = document.createElement('button'); copy.type = 'button'; copy.className = 'primary'; copy.textContent = 'Copy for Slack';
      copy.addEventListener('click', () => copyFormatted(body, status));
      const plain = document.createElement('button'); plain.type = 'button'; plain.textContent = 'Copy plain';
      plain.addEventListener('click', () => copyPlain(body, status));
      // A tombstone, not a delete, so the Mac sees it: Sent moves its file to
      // sent/ (so Claude knows it went out), the trash icon moves it to the Trash.
      const done = async sent => {
        const now = Date.now();
        const id = d.name.replace(/\.md$/, '').replace(/[^A-Za-z0-9_.~:@+-]/g, '_') + '-phone-' + now;
        try { await db.collection('drafts').doc(id).set({ name: d.name, deleted: true, sent, from: 'phone', savedAt: now }); }
        catch (e) { say(status, false, 'Could not ' + (sent ? 'mark it sent' : 'discard it') + ' (' + why(e) + ').'); }
      };
      const sentBtn = document.createElement('button'); sentBtn.type = 'button'; sentBtn.textContent = 'Sent';
      sentBtn.addEventListener('click', () => done(true));
      const del = document.createElement('button'); del.type = 'button'; del.className = 'quiet icon';
      del.setAttribute('aria-label', 'Discard draft'); del.title = 'Discard';
      del.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/></svg>';
      del.addEventListener('click', () => done(false));
      actions.append(copy, plain, sentBtn, del);

      card.append(meta, place, msg, actions, status);
      list.append(card);
    }
  };

  // Both sides only add rows (a new row per save, a tombstone per delete), so the
  // newest row per draft name wins and the rest are leftovers this page tidies once.
  // A phone delete stays until the Mac answers it with its own tombstone, which says
  // the file is in the Trash. ponytail: a draft no Mac holds keeps its rows, hidden.
  const fold = docs => {
    const byName = new Map();
    for (const doc of docs) {
      const row = doc.data();
      if (!row || typeof row.name !== 'string') continue;
      const g = byName.get(row.name) || { name: row.name, ids: [], newest: null, macDeleted: false };
      g.ids.push(doc.id);
      if (row.deleted && row.from !== 'phone') g.macDeleted = true;
      if (!g.newest || (row.savedAt || 0) > (g.newest.savedAt || 0)) g.newest = { ...row, id: doc.id };
      byName.set(row.name, g);
    }
    const groups = [...byName.values()];
    const live = groups.filter(g => !g.newest.deleted)
      .map(g => ({ name: g.name, md: String(g.newest.md || ''), savedAt: g.newest.savedAt || 0 }))
      .sort((a, b) => b.savedAt - a.savedAt);
    const stale = groups.flatMap(g => g.newest.deleted ? (g.macDeleted ? g.ids : []) : g.ids.filter(id => id !== g.newest.id));
    return { live, stale };
  };

  const prune = async (db, ids) => {
    for (const id of ids) {
      try { await db.collection('drafts').doc(id).delete(); } catch (e) { return; }
    }
  };

  (async () => {
    const db = await window.claude?.use?.('db');
    if (!db) {
      showEmpty('Drafts are not available here', 'Open this page signed in to Claude to see your drafts.');
      return;
    }
    db.collection('drafts').onSnapshot(snap => {
      const { live, stale } = fold(snap.docs);
      drafts = live;
      render(db);
      if (!pruned && !snap.metadata.fromCache && stale.length) {
        pruned = true;
        setTimeout(() => prune(db, stale), 0);
      }
    }, e => showEmpty('Could not load drafts', 'The store answered: ' + why(e) + '. Reload the page to try again.'));
  })();
</script>
